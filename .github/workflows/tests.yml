name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check calculator.js
      - run: node --check tests.js
      - run: node --check app.js
      - run: node --check run-tests.js
      - run: node run-tests.js
