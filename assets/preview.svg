<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="川赔通应用界面预览">
  <defs>
    <linearGradient id="appBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f8"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d2137"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="total" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2137"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0d2137" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="760" fill="url(#appBg)"/>
  <rect width="1280" height="92" fill="url(#header)"/>
  <rect y="92" width="1280" height="4" fill="#d69e2e"/>

  <text x="48" y="58" fill="#ffffff" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="700">⚖️ 川赔通</text>
  <text x="160" y="58" fill="#cbd5e1" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20">四川省劳动争议赔偿计算器</text>
  <rect x="1070" y="28" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.26"/>
  <text x="1145" y="54" fill="#ffffff" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" text-anchor="middle">测试用例</text>

  <rect x="48" y="132" width="560" height="176" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="80" y="180" fill="#17273d" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700">1 · 离职情形</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17">
    <rect x="80" y="210" width="245" height="48" rx="12" fill="#e3edfd" stroke="#2563eb" stroke-width="2"/>
    <text x="202" y="240" fill="#1d4e89" text-anchor="middle" font-weight="700">违法解除 2N</text>
    <rect x="338" y="210" width="235" height="48" rx="12" fill="#f8fafc" stroke="#dfe7f1"/>
    <text x="455" y="240" fill="#5c6b80" text-anchor="middle">协商解除 N</text>
    <rect x="80" y="268" width="245" height="26" rx="8" fill="#ecfdf5"/>
    <text x="202" y="286" fill="#047857" text-anchor="middle" font-size="15">已选择：违法解除 / 无理由辞退</text>
  </g>

  <rect x="48" y="332" width="560" height="316" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="80" y="380" fill="#17273d" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700">2 · 基础信息</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="80" y="412" width="496" height="52" rx="12" fill="#fbfcfe" stroke="#cfd9e6"/>
    <text x="104" y="444" fill="#5c6b80" font-size="17">入职日期：2020-03-01</text>
    <rect x="80" y="482" width="496" height="52" rx="12" fill="#fbfcfe" stroke="#cfd9e6"/>
    <text x="104" y="514" fill="#5c6b80" font-size="17">离职日期：2024-08-15</text>
    <rect x="80" y="552" width="496" height="52" rx="12" fill="#fbfcfe" stroke="#cfd9e6"/>
    <text x="104" y="584" fill="#5c6b80" font-size="17">月平均工资：¥9,000</text>
  </g>

  <rect x="648" y="132" width="584" height="176" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="680" y="180" fill="#17273d" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700">3 · 补充主张</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17">
    <rect x="680" y="210" width="500" height="44" rx="12" fill="#f8fafc" stroke="#dfe7f1"/>
    <circle cx="706" cy="232" r="10" fill="#2563eb"/>
    <text x="730" y="239" fill="#17273d">未签书面合同二倍工资</text>
    <rect x="680" y="264" width="500" height="30" rx="10" fill="#fffbeb"/>
    <text x="706" y="284" fill="#92400e">加班费 · 年休假 · 试用期赔偿</text>
  </g>

  <rect x="648" y="332" width="584" height="316" rx="20" fill="url(#total)" filter="url(#shadow)"/>
  <rect x="648" y="332" width="584" height="8" rx="4" fill="#d69e2e"/>
  <text x="940" y="410" fill="#cbd5e1" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" text-anchor="middle">可主张金额合计</text>
  <text x="940" y="486" fill="#ffffff" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="56" font-weight="700" text-anchor="middle">¥ 81,000</text>
  <text x="940" y="536" fill="#f2c66d" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" text-anchor="middle">4.5 年限系数 × ¥9,000 × 2</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17">
    <rect x="708" y="572" width="220" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
    <text x="818" y="597" fill="#ffffff" text-anchor="middle">计算过程</text>
    <rect x="944" y="572" width="220" height="38" rx="19" fill="#ffffff" fill-opacity="0.12"/>
    <text x="1054" y="597" fill="#ffffff" text-anchor="middle">法条依据</text>
  </g>

  <rect x="48" y="674" width="1184" height="48" rx="12" fill="#e3edfd" stroke="#c7d7f8"/>
  <text x="640" y="705" fill="#1d4e89" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" text-anchor="middle">⚠️ 仅供参考，不构成法律意见 · 44/44 项自动化测试通过</text>
</svg>
